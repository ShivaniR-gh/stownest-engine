<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <!-- Tab icon. The SVG is the primary mark: it stays sharp at any density
         and follows the tab's own background, so no second dark-mode asset is
         needed. Safari's pinned tabs and older browsers ignore SVG favicons,
         which is what the PNG line is for once you export one. -->
    <link rel="icon" type="image/svg+xml" href="/sn.png" />
    <link rel="apple-touch-icon" href="/sn.png" />
    <meta name="theme-color" content="#4CAF50" />
  </head>
